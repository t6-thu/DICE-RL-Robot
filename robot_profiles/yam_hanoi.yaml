# Oopsie profile for the existing YAM Hanoi NPZ rollouts.
#
# The fields that can be established from this repository are filled in. The
# policy identity must be confirmed by the dataset owner before conversion;
# leaving it blank makes the preflight fail safely. Joint names/order come from
# i2rt/i2rt/robot_models/yam/yam_4310_linear.xml and the runner's [:6] layout.

policy_name:
robot_name: yam
gripper_name: linear_4310
is_biarm: false
uses_mobile_base: false
control_freq: 30

camera_names:
  - wrist
  - base

robot_state_keys:
  - joint_position
  - gripper_position

robot_state_joint_names:
  - joint1
  - joint2
  - joint3
  - joint4
  - joint5
  - joint6

action_space:
  - joint_position
  - gripper_position

action_joint_names:
  - joint1
  - joint2
  - joint3
  - joint4
  - joint5
  - joint6

controller: joint_position
